[package]
name = "equxi"
version = "0.1.0"
description = "Solana-native trust layer for AI agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "equxi"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi-no-account-lifetime = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
