[package]
name = "equxi"
version = "0.1.0"
description = "Solana-native trust layer for AI agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "equxi"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi-no-account-lifetime = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# anchor-syn 0.30.1 calls proc_macro2::Span::source_file(), which was removed
# in proc-macro2 1.0.95 (E0599: "no method named `source_file`" while building
# the IDL). This repo does not track Cargo.lock, so the constraint must live
# here: pin the last release that still has the method. Once anchor-lang moves
# past 0.30.x, this pin can go.
proc-macro2 = "=1.0.94"
anchor-spl = "0.30.1"
