[package]
name = "equxi"
version = "0.1.0"
description = "Solana-native trust layer for AI agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "equxi"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi-no-account-lifetime = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# 0.31.2, not 0.30.1: anchor-syn 0.30.x calls proc_macro2::Span::source_file(),
# which no longer compiles on any 2025+ toolchain (the nightly rustc shipped in
# Solana's platform-tools renamed the span APIs in April 2025). 0.31.x removed
# that usage; the account/instruction formats are unchanged between 0.30 and
# 0.31, so this is a build-system-only bump.
anchor-lang = { version = "0.31.2", features = ["init-if-needed"] }
