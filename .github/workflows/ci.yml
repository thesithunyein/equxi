name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SDK dependencies
        run: cd sdk && npm install

      - name: Typecheck SDK
        run: cd sdk && npx tsc --noEmit

  test:
    name: Anchor Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0

      - name: Setup Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Setup Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          avm install 0.30.1
          avm use 0.30.1

      - name: Configure Solana
        run: |
          solana-keygen new --no-bip39-passphrase --force
          solana config set --url localhost

      - name: Ensure compatible lockfile
        run: |
          rm -f programs/equxi/Cargo.lock
          rustup override set 1.82.0

      - name: Build
        run: anchor build

      - name: Test
        run: anchor test --skip-local-validator

  deploy-check:
    name: Deploy Readiness
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "Checking project structure..."
          test -f index.html || exit 1
          test -f app.html || exit 1
          test -f styles.css || exit 1
          test -f app.css || exit 1
          test -f main.js || exit 1
          test -f app.js || exit 1
          test -f programs/equxi/src/lib.rs || exit 1
          test -f sdk/src/index.ts || exit 1
          test -f Anchor.toml || exit 1
          test -f setup.sh || exit 1
          echo "✅ All files present"

      - name: Verify README
        run: |
          grep -q "Quick Start" README.md || exit 1
          grep -q "SDK Usage" README.md || exit 1
          grep -q "equxi.sithunyein.com" README.md || exit 1
          echo "✅ README is complete"
