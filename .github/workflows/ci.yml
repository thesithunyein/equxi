name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The real gate: compiles the Rust program and runs the anchor test suite
  # against a local validator. Before this existed, CI never invoked the Rust
  # toolchain at all, so nothing caught a broken program or a broken test.
  program:
    name: Build & Test Program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Anchor 0.31.x is maintained against current toolchains, so stable
      # rustc is fine. (With anchor 0.30.1 the build needed anchor 0.30-era
      # pins and still failed inside platform-tools' bundled rustc; the
      # upgrade in programs/equxi/Cargo.toml is what fixed the toolchain
      # mismatch, so keep these two in mind together.)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Install the real CLI via cargo, not the npm @coral-xyz/anchor-cli
      # wrapper: on 0.31.2 that wrapper detects a version-mismatched binary,
      # prints "Trying globally installed anchor / Could not find globally
      # installed anchor" and exits 0 WITHOUT building or testing anything —
      # a step marked success while doing nothing. cargo install puts the
      # actual `anchor` binary in ~/.cargo/bin, which rust-cache persists.
      - name: Install Anchor CLI
        run: cargo install --locked anchor-cli --version 0.31.2

      - name: Install JS dependencies
        run: npm install

      - name: Create a local test wallet
        run: solana-keygen new --no-bip39-passphrase --silent --force

      - name: Sync program keypair with declare_id
        run: |
          mkdir -p target/deploy
          anchor keys sync

      - name: Build program
        run: anchor build

      - name: Run program tests
        run: anchor test --skip-build

      # Publish the exact bytes this job built and tested, so a devnet deploy
      # is provably the same artifact CI verified rather than a local rebuild
      # that might have drifted. Uploaded only after the tests pass.
      - name: Upload built program
        uses: actions/upload-artifact@v4
        with:
          name: equxi-program
          path: target/deploy/equxi.so
          if-no-files-found: error
          retention-days: 30

  # Pure-Rust tests, no validator: the byte-level account migration can be
  # checked exhaustively here, which is cheaper and far more thorough than
  # trying to fabricate a v0.1-shaped account on a test validator.
  rust-unit:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run program unit tests
        run: cargo test --manifest-path programs/equxi/Cargo.toml --features no-entrypoint

  # Fast, validator-free checks. These lock the wire format shared by the SDK,
  # the elizaOS plugin, and the web app, and they fail on the kind of drift that
  # previously shipped silently (a stale hand-written IDL, a stale discriminator,
  # a changed account layout). They need no Solana toolchain, so they run in
  # about a minute and can gate every pull request.
  unit:
    name: Wire-format Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck tests, SDK and plugin
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p sdk/tsconfig.json

      - name: Run unit tests
        run: npm run test:unit

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install SDK dependencies
        run: cd sdk && npm install
      - name: Typecheck SDK
        run: cd sdk && npx tsc --noEmit
      - name: Install plugin dependencies
        run: cd eliza-plugin && npm install
      - name: Typecheck elizaOS plugin
        run: cd eliza-plugin && npx tsc --noEmit

  verify:
    name: Verify Project Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project structure
        run: |
          echo "Checking project structure..."
          test -f index.html || exit 1
          test -f app.html || exit 1
          test -f styles.css || exit 1
          test -f app.css || exit 1
          test -f main.js || exit 1
          test -f app.js || exit 1
          test -f programs/equxi/src/lib.rs || exit 1
          test -f programs/equxi/src/state.rs || exit 1
          test -f programs/equxi/src/error.rs || exit 1
          test -f sdk/src/index.ts || exit 1
          test -f sdk/src/idl/equxi.json || exit 1
          test -f eliza-plugin/src/coder.ts || exit 1
          test -f api/trust.js || exit 1
          test -f api/trust.d.ts || exit 1
          test -f api/badge.js || exit 1
          test -f api/badge.d.ts || exit 1
          test -f lib/equxi-layout.js || exit 1
          test -f explorer.html || exit 1
          test -f explorer.js || exit 1
          test -f landing.js || exit 1
          test -f dev-server.js || exit 1
          # The upgrade path: a broken migration tool is worse than none, and it
          # only ever runs against a live deployment, so check it here instead.
          test -f migrate.js || exit 1
          test -f deploy-v2.sh || exit 1
          node --check migrate.js || exit 1
          bash -n deploy-v2.sh || exit 1
          # Production deploys from Vercel's git integration and verify.yml
          # checks the result. A malformed or renamed workflow fails silently
          # on the one push that needed it. This job has no node_modules, so
          # assert the parts that must be true rather than adding a YAML
          # parser as a dependency to check syntax.
          test -f .github/workflows/verify.yml || exit 1
          grep -q 'branches: \[main\]' .github/workflows/verify.yml || exit 1
          grep -q 'equxi.sithunyein.com' .github/workflows/verify.yml || exit 1
          grep -q 'api/trust' .github/workflows/verify.yml || exit 1
          test -f tests/unit/layout.test.ts || exit 1
          test -f tests/unit/sdk.test.ts || exit 1
          test -f tests/unit/read.test.ts || exit 1
          test -f tests/unit/api.test.ts || exit 1
          test -f tests/unit/landing.test.ts || exit 1
          test -f tests/unit/copy.test.ts || exit 1
          test -f Anchor.toml || exit 1
          test -f setup.sh || exit 1
          echo "All files present"
      - name: Verify Rust program structure
        run: |
          echo "Checking Rust program..."
          head -5 programs/equxi/src/lib.rs | grep -q "anchor_lang" || exit 1
          for ix in initialize create_vault migrate_agent register_agent create_bond \
                    withdraw_bond add_constraint execute_slash compensate_victim \
                    update_trust_score; do
            grep -q "fn handler" "programs/equxi/src/instructions/$ix.rs" || exit 1
          done
          echo "All program instructions present"
      - name: Verify SDK
        run: |
          echo "Checking SDK..."
          grep -q "class EquxiClient" sdk/src/index.ts || exit 1
          grep -q "registerAgent" sdk/src/index.ts || exit 1
          grep -q "createBond" sdk/src/index.ts || exit 1
          grep -q "executeSlash" sdk/src/index.ts || exit 1
          # The IDL must stay in the Anchor 0.30 shape: an `address`, and the
          # `pubkey` type. Using `publicKey` silently broke `new Program(...)`.
          grep -q '"address"' sdk/src/idl/equxi.json || exit 1
          grep -q '"pubkey"' sdk/src/idl/equxi.json || exit 1
          if grep -q '"publicKey"' sdk/src/idl/equxi.json; then
            echo "IDL uses the retired 'publicKey' type" && exit 1
          fi
          echo "SDK complete"
      - name: Verify read API
        run: |
          echo "Checking the read API..."
          # The function must not acquire dependencies: `vercel.json` disables the
          # build, so anything imported here has to resolve at runtime unbuilt.
          # Every `require` must therefore be relative.
          for f in api/trust.js api/badge.js lib/equxi-layout.js; do
            if grep -oE 'require\("[^"]+"\)' "$f" | grep -vE 'require\("\.[^"]*"\)'; then
              echo "$f requires a package; it must stay dependency-free" && exit 1
            fi
          done
          node --check api/trust.js || exit 1
          node --check api/badge.js || exit 1
          node --check lib/equxi-layout.js || exit 1
          node --check explorer.js || exit 1
          node --check landing.js || exit 1
          node --check dev-server.js || exit 1
          grep -q 'module.exports' api/trust.js || exit 1
          grep -q 'module.exports' api/badge.js || exit 1
          # The badge must escape the agent-controlled values it prints.
          grep -q 'function xml(' api/badge.js || exit 1
          # The landing page reads this API, and agent names are attacker
          # controlled. It writes every value with textContent, so nothing from
          # the chain can become markup — assert that, rather than asserting an
          # escape helper the page no longer needs.
          grep -q 'textContent' landing.js || exit 1
          if grep -nE 'innerHTML[[:space:]]*=' landing.js; then
            echo "landing.js assigns innerHTML; chain values must go in as text" && exit 1
          fi
          grep -q '/api/trust' landing.js || exit 1
          grep -q 'src="landing.js"' index.html || exit 1
          # Every api/*.js file is a route; dev-server.js must serve the same set
          # or the Explorer cannot be developed locally.
          for route in trust badge; do
            grep -q "/api/$route" dev-server.js || exit 1
          done
          echo "Read API complete"
      - name: Verify README
        run: |
          grep -q "Equxi" README.md || exit 1
          grep -q "equxi.sithunyein.com" README.md || exit 1
          echo "README is complete"
