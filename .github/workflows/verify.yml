name: Verify Live Site

# Production deploys happen in Vercel now: the project's Git link points at
# this repository, so every push to main builds and ships on their side.
# Nothing here deploys anything — that would race Vercel and double-ship.
#
# What this adds is the check that a finished build is not the same thing as
# a working site. The deploy pipeline reports success on upload; only a real
# request tells you the pages a judge opens actually serve.
#
# Timing, learned the hard way: this job starts within seconds of the push, and
# a CDN can serve the new HTML a moment before every asset in the same deploy.
# The first version checked each URL once immediately after a liveness probe
# that the *previous* build also passes, so it caught a half-propagated deploy
# and reported a broken site that was fine a second later. Every assertion now
# retries for up to a minute and only a condition that stays false fails the
# run, which is why a red X here means something.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Smoke check production
    runs-on: ubuntu-latest
    steps:
      - name: Check the pages a judge opens
        run: |
          # The custom domain is the canonical host now, and these probes use
          # `curl` without `-L`, so they need the name that answers 200 itself:
          # the apex 308s to `www`, and claiming the apex here would read the
          # redirect body as the page and fail on a perfectly good deploy.
          BASE=https://www.equxi.tech
          WANT=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          # Built once, so the quoting lives in one place rather than in every
          # test: `"commit":"<sha>"` exactly, quotes included.
          NEEDLE="\"commit\":\"$WANT\""
          # Set before the first assertion: the commit wait below can fail, and a
          # later `fail=0` would quietly erase that verdict.
          fail=0

          # Wait for *this* commit, not merely for a site that answers. The two
          # are different questions, and conflating them cost hours: a rejected
          # `vercel.json` failed every deploy while every check here stayed
          # green, because the pages it asserted were already served by the
          # previous build. `/api/health` names the commit it was built from, so
          # this is the one probe that distinguishes the two.
          echo "waiting for commit $WANT to serve"
          health=""
          attempts=0
          while [ $attempts -lt 30 ]; do
            health=$(curl -s --max-time 20 -H 'cache-control: no-cache' "$BASE/api/health" 2>/dev/null || true)
            if printf '%s' "$health" | grep -qF "$NEEDLE"; then break; fi
            attempts=$((attempts+1))
            if [ $attempts -lt 30 ]; then sleep 10; fi
          done

          if printf '%s' "$health" | grep -qF "$NEEDLE"; then
            echo "commit $WANT is live"
          elif printf '%s' "$health" | grep -qF '"commit":"'; then
            # The build names a different commit: the deploy was rejected or has
            # not been promoted. This is the check that matters, because every
            # assertion below can pass against a stale build — which is how a
            # rejected vercel.json went unnoticed for hours.
            echo "::error title=Stale deployment::$BASE is serving a build other than $WANT. Check that vercel.json is valid — a rejected config fails every deploy."
            fail=1
          else
            # No build identity at all: do not fail the run over a platform
            # variable, but say so, because the staleness check is then blind.
            echo "::warning title=Build identity::/api/health does not name a commit, so this run cannot prove $WANT is the build being served."
          fi

          # check <label> <url> [required-pattern]
          # Retried, because a push can surface the new HTML before its assets.
          # `no-cache` makes the edge revalidate rather than hand back the build
          # this push just replaced.
          check() {
            label="$1"; url="$2"; pattern="$3"
            n=0; code=000
            while [ $n -lt 6 ]; do
              body=$(curl -s --max-time 30 -H 'cache-control: no-cache' -w '\n%{http_code}' "$url" 2>/dev/null || true)
              code=$(printf '%s' "$body" | tail -n 1)
              if [ "$code" = "200" ] && { [ -z "$pattern" ] || printf '%s' "$body" | grep -q "$pattern"; }; then
                printf '%-18s %s\n' "$label" "200"
                return 0
              fi
              n=$((n+1))
              if [ $n -lt 6 ]; then sleep 10; fi
            done
            printf '%-18s FAILED (last status %s)\n' "$label" "$code"
            return 1
          }

          # launch.html is on the list because it is the link filed with the
          # Meteora track: the page a judge is most likely to open was the one
          # page this check never opened.
          for path in "" explorer.html app.html docs.html deck.html launch.html aas-2.html api/trust; do
            check "/${path:-}" "$BASE/$path" "" || fail=1
          done

          # contract <label> <url> <expected-status>
          # The status is part of the API's contract, not a detail: a caller
          # asking about one address branches on 404. Retried briefly even though
          # the commit wait above already proves the build is live, so a single
          # edge hiccup cannot redden the run.
          contract() {
            label="$1"; url="$2"; want="$3"
            n=0; code=000
            while [ $n -lt 6 ]; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H 'cache-control: no-cache' "$url" 2>/dev/null || true)
              if [ "$code" = "$want" ]; then
                printf '%-18s %s\n' "$label" "$code"
                return 0
              fi
              n=$((n+1))
              if [ $n -lt 6 ]; then sleep 10; fi
            done
            printf '%-18s FAILED (last status %s, want %s)\n' "$label" "$code" "$want"
            return 1
          }

          # A valid address that holds no agent account is a 404, so "not found"
          # is distinguishable from "found, with nothing at stake". A named owner
          # with no agents is still a 200: the address exists.
          absent=SysvarRent111111111111111111111111111111111
          contract "unknown agent" "$BASE/api/trust?agent=$absent" 404 || fail=1
          contract "unknown owner" "$BASE/api/trust?owner=$absent" 200 || fail=1
          contract "api/health" "$BASE/api/health" 200 || fail=1

          # The live numbers are filled client-side from /api/trust, so a build
          # that ships the markup without the script (or the reverse) still
          # returns 200 on every page and looks completely fine. Assert both
          # halves of the landing page are actually being served.
          check "/ (live stats)" "$BASE/" 'data-fill="bonded"' || fail=1
          check "/landing.js" "$BASE/landing.js" "api/trust" || fail=1
          # The page is useless if the verifier markup or its script is missing,
          # and both still return 200 when they are. Assert the two halves.
          check "/aas-2 (verifier)" "$BASE/aas-2.html" 'data-a2-run="published"' || fail=1
          check "/aas-2.js" "$BASE/aas-2.js" "aas2-verify" || fail=1

          # Health names the RPC host and whether it answered, so a deploy that
          # points at a dead upstream is visible from one request.
          health=$(curl -s --max-time 20 -H 'cache-control: no-cache' "$BASE/api/health" || true)
          case "$health" in
            *'"reachable":true'*) echo "Health: upstream reachable" ;;
            *) echo "::warning title=Health::/api/health did not report a reachable upstream." ;;
          esac

          title=$(curl -s --max-time 20 -H 'cache-control: no-cache' "$BASE/" | grep -o '<title>[^<]*</title>' || true)
          echo "Live title: $title"
          case "$title" in
            *"Slashable collateral"*) : ;;
            *) echo "::warning title=Stale content?::The live title does not match the expected hero. If this push changed the landing page, production may be serving an older build."; fail=1 ;;
          esac
          exit $fail

      # The page's whole promise is that a stranger can check a receipt. This
      # runs the same check a visitor's browser runs: load the pinned artifacts
      # from the deployment, post them back, and require the pinned core hash.
      # It catches the failures a 200 cannot see — a ruleset missing from the
      # function bundle, a broken RPC path, a verifier key that stopped matching.
      - name: Verify a published receipt through the API
        run: |
          node -e '
          const base = "https://www.equxi.tech";
          const pinned = "sha256:b1f97888e86de051ceb6d2f282eaed81243049c804e19dbfef949c6533645e52";
          const getJson = async (path) => {
            const response = await fetch(base + path);
            if (!response.ok) throw new Error(path + " " + response.status);
            return response.json();
          };
          const getText = async (path) => {
            const response = await fetch(base + path);
            if (!response.ok) throw new Error(path + " " + response.status);
            return response.text();
          };
          (async () => {
            const payload = {
              receipt: await getJson("/fixtures/aas-2/mainnet/receipt.json"),
              agreement: await getJson("/fixtures/aas-2/mainnet/agreement.signed.json"),
              report: await getJson("/fixtures/aas-2/mainnet/report.json"),
              output: await getText("/fixtures/aas-2/output.product-feed.csv"),
              cluster: "mainnet"
            };
            const response = await fetch(base + "/api/aas2-verify", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload)
            });
            const body = await response.json();
            if (!response.ok || !body.valid || body.core_hash !== pinned) {
              console.error(JSON.stringify(body, null, 2));
              process.exit(1);
            }
            console.log("aas2-verify " + body.passed + "/" + body.total + " " + body.evidence_level + " " + body.elapsed_ms + "ms");
          })().catch((error) => { console.error(error); process.exit(1); });
          '
