name: Deploy

# Pushing to main and shipping were two unrelated steps, and nothing connected
# them: the Vercel project is *sourceless* (created by `vercel deploy`, not by a
# Git import), so it has no GitHub webhook and Vercel never builds from a push.
# `vercel git connect` reports the repo as connected because a link record
# exists, which makes the gap look like it shouldn't be there.
#
# This workflow closes it from the GitHub side instead, where the push event
# actually is.
#
# It needs one repository secret: VERCEL_TOKEN, a personal token from
# https://vercel.com/account/tokens. Until that exists the job reports a
# warning and skips rather than failing every push.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once. Deliberately not cancel-in-progress:
# cancelling a deploy mid-flight can leave the alias pointing at a half-updated
# deployment, and a queue is cheap.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checked through env rather than `if: secrets.X` so the guard cannot
      # depend on how the runner exposes secrets to expressions.
      - name: Check for deploy token
        id: guard
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning title=Deploy skipped::VERCEL_TOKEN is not set, so production was not updated. Create a token at https://vercel.com/account/tokens and add it with: gh secret set VERCEL_TOKEN --repo thesithunyein/equxi"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The site is static HTML, so it does not need the Rust toolchain or a
      # validator to gate it. These tests cover the wire formats, the account
      # layout and the read layer, cost about a second, and are the only thing
      # standing between a broken script tag and production.
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm install

      - name: Run unit tests
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:unit

      - name: Deploy
        if: steps.guard.outputs.skip != 'true'
        id: deploy
        env:
          VERCEL_ORG_ID: team_2PcfOyv6de0KPp5qFp9Bamyi
          VERCEL_PROJECT_ID: prj_9Ds0hOyospSg8SfKrB5PemznLtBJ
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(npx --yes vercel@58 deploy --prod --yes --token="$VERCEL_TOKEN" | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"

      # A deploy that reports success and serves a 500 is not a deploy. Check
      # the pages a judge actually opens, not the deployment status.
      - name: Smoke check the live site
        if: steps.guard.outputs.skip != 'true'
        run: |
          BASE=https://equxi.sithunyein.com
          fail=0
          for path in "" explorer.html app.html docs.html deck.html api/trust; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 4 --retry-delay 5 "$BASE/$path")
            printf '%-16s %s\n' "/${path:-}" "$code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
