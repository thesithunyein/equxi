[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
equxi = "D7akK6aUVdYWfSwRDtuKFExZQkqtWZ1EFrRz1LQdfvhc"

[registry]
url = "https://api.apr.dev"

[provider]
# Tests must run against a local validator, never devnet: `anchor test`
# deploys the freshly built program to the configured cluster first, and a
# CI wallet on devnet has no SOL. CI starts its own validator.
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Two patterns, not "tests/**/*.ts": bash expands ** without globstar to
# subdirectory files only, which silently skipped the on-chain suite in
# tests/*.ts while CI stayed green.
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/*.ts tests/**/*.ts"
