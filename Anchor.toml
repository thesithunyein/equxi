[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
equxi = "D7akK6aUVdYWfSwRDtuKFExZQkqtWZ1EFrRz1LQdfvhc"

[registry]
url = "https://api.apr.dev"

[provider]
# Tests must run against a local validator, never devnet: `anchor test`
# deploys the freshly built program to the configured cluster first, and a
# CI wallet on devnet has no SOL. CI starts its own validator.
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[test]
# Load the program on the local validator exactly the way a real deployment
# looks: upgradeable, upgrade authority = the wallet (`anchor test` then passes
# `--upgradeable-program <id> <so> <wallet-pubkey>` to solana-test-validator).
#
# Without this, anchor passes the 2-argument `--bpf-program <id> <so>` form,
# which gives the program an upgrade authority that is NOT the test wallet. The
# program deliberately requires the upgrade authority to sign `initialize`
# (otherwise anyone could claim the admin role), so the whole on-chain suite
# failed with InvalidAdminAuthority on the first test and the other twelve
# cascaded from the config never existing.
upgradeable = true

[scripts]
# Two patterns, not "tests/**/*.ts": bash expands ** without globstar to
# subdirectory files only, which silently skipped the on-chain suite in
# tests/*.ts while CI stayed green.
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/*.ts tests/**/*.ts"
